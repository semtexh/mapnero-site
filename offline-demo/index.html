<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MapNero · Imported map offline viewer</title><style>body{margin:0;padding:22px;background:#f6f8f2;color:#172720;font:16px system-ui;max-width:760px}[hidden]{display:none!important}h1{font-size:26px}p{line-height:1.6}canvas{max-width:100%;height:auto}img{display:block;max-width:100%;height:auto}button{min-height:44px;padding:10px 16px;font:16px system-ui;margin:14px 0}details img{max-height:480px;width:auto}#map{border:1px solid #b7c6b0;border-radius:6px;touch-action:pan-y}#meta{overflow-wrap:anywhere}</style><script src="../assets/walkthrough-offline-store.js" defer></script><script src="offline-page.js" defer></script></head><body><h1>MapNero · Your imported map offline</h1><p>This separate viewer reads the actual imported image and original file saved in this browser. It does not use online basemap tiles or GPS. A raw image has no verified coordinates.</p><details><summary>Actual MapNero offline screen</summary><img src="../assets/guides/screenshots/apple/en/offline-maps.png" alt="Actual MapNero offline map screen"></details><p id="meta" role="status">Reading local map…</p><img id="map" hidden alt="Actual stored imported map pixels"><section id="pdf" hidden><p id="page-status" role="status"></p><canvas id="pdf-page" role="img"></canvas><button id="previous" disabled>Previous PDF page</button><button id="next" disabled>Next PDF page</button></section><button id="download" disabled>Download stored original file</button><button id="reload">Read saved map again</button></body></html>
